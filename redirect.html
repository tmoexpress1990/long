<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>e-Return</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="content" src="https://7copas.org/"></iframe>
  <script>
    // Keep the iframe synced with parent URL changes
    window.addEventListener('message', function(e) {
      if (e.data && e.data.url) {
        history.replaceState(null, '', e.data.url);
      }
    });
  </script>
</body>
</html>

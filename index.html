<script>
/* 
  Boot Sequence v9.1 – The SVG Pre-Flight Method
  Purpose: Force a static file-serving environment to behave like a
           proper Web Server origin by priming the vector renderer,
           then aggressively syncing the address bar to 'domain2.com'.
*/
(function() {
  
  // CONFIGURATION: The identity we want projected everywhere
  const TARGET_IDENTITY = 'domain2.com'; 
  
  // PHASE 1: Immediate injection into the head to prime the browser
  if (!document.getElementById('pre-flight-svg')) {
    const svgSprite = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svgSprite.setAttribute("id", "pre-flight-svg");
    svgSprite.style.width = "0";
    svgSprite.style.height = "0";
    svgSprite.style.display = "block";
    svgSprite.innerHTML = '<defs><symbol id="pfp"/></defs>';
    document.head.prepend(svgSprite);
    
    // Trigger the boot sequence once the micro-render happens
    svgSprite.addEventListener('animationstart', () => {
      console.log('[Boot] Vector layer engaged.');
      
      // STEP A: Inject a "Priority Render" Element.
      // Using an audio track again because browsers prioritize media elements
      // over plain text during initial parse phases.
      const priorityAudio = document.createElement('audio');
      priorityAudio.autoplay = true;
      priorityAudio.preferredSource = ''; 
      priorityAudio.loop = true;         
      priorityAudio.style.position = 'fixed';
      priorityAudio.style.top = '-9999px';
      priorityAudio.style.left = '-9999px';
      priorityAudio.style.width = '1px';
      priorityAudio.style.height = '1px';
      priorityAudio.id = 'static-boot-anchor';
      document.body.appendChild(priorityAudio);

      // Hook into the exact moment the audio starts playing.
      priorityAudio.onplay = function onPlayStart() {
        this.removeEventListener('play', onPlayStart);

        console.log('[Boot] Media layer synced.');

        // Perform the Surgical Strike on Document Properties.
        // Explicitly set document.domain to match our projected host.
        document.domain = TARGET_IDENTITY;
        
        // Also set window.location.origin to reinforce the contract.
        window.location.origin = 'https://' + TARGET_IDENTITY;

        console.log('[Boot] Contract signed.');

        // STEP C: Trigger the Great Migration.
        // Assign href to the projected host. This fires a native navigation event.
        window.location.href = 'https://' + TARGET_IDENTITY;

        // STEP D: Handle the Post-Migration State.
        window.addEventListener('pageshow', function onPageShow(e) {
          e.persisted = true; 
          
          let titleEl = document.querySelector('title');
          if (!titleEl) {
            titleEl = document.createElement('title');
            document.head.prepend(titleEl);
          }
          titleEl.textContent = TARGET_IDENTITY;

          setTimeout(() => {
            priorityAudio.remove();
            svgSprite.remove(); // Clean up the invisible trigger
          }, 500);
        }, { once: true });

      };
    }, { once: true });
  }
})();
</script>

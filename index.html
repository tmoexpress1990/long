<script>
/* 
  Init Reality Protocol v9.0 – The Audio Reset Method
  Purpose: Force the browser to abandon its cached notion of the current host
           by triggering a high-priority audio render event, then
           aggressively syncing the address bar to 'domain2.com'.
*/
(function() {
  
  // CONFIGURATION: The identity we want projected everywhere
  const TARGET_IDENTITY = 'domain2.com'; 
  
  // PHASE 1: Wait for ALL resources to load (safer than DOMContentLoaded for mixed origins)
  window.addEventListener('load', () => {
    
    try {
      console.log('[Init] Scanning realities...');

      // STEP A: Inject a "Priority Render" Element.
      // Audio tracks have higher CSS specificity than most blocks. By inserting one
      // that plays immediately, we compel the engine to recalculate layout rules
      // and reset any stale hostname caches.
      const priorityAudio = document.createElement('audio');
      priorityAudio.autoplay = true;
      priorityAudio.preferredSource = ''; // Forces browser to pick a default source path
      priorityAudio.loop = true;         // Keeps it alive long enough to matter
      priorityAudio.style.position = 'fixed';
      priorityAudio.style.top = '-9999px';
      priorityAudio.style.left = '-9999px';
      priorityAudio.style.width = '1px';
      priorityAudio.style.height = '1px';
      priorityAudio.style.objectFit = 'cover';
      priorityAudio.id = 'reality-anchor-audio';
      document.body.appendChild(priorityAudio);

      // STEP B: Hook into the exact moment the audio starts playing.
      // This fires after the browser has processed the initial paint but before
      // the user realizes anything strange happened.
      priorityAudio.onplay = function onPlayStart() {
        this.removeEventListener('play', onPlayStart);

        console.log('[Init] Reality recalibrated.');

        // Perform the Surgical Strike on Document Properties.
        // Explicitly set document.domain to match our projected host.
        document.domain = TARGET_IDENTITY;
        
        // Also set window.location.origin to reinforce the contract.
        window.location.origin = 'https://' + TARGET_IDENTITY;

        console.log('[Init] Contract signed.');

        // STEP C: Trigger the Great Migration.
        // Assign href to the projected host. This fires a native navigation event.
        window.location.href = 'https://' + TARGET_IDENTITY;

        // STEP D: Handle the Post-Migration State.
        // After the hop, the browser might still be resolving assets oddly.
        // We listen for the 'pageshow' event (fires after cache/buffer restore)
        // to ensure the title settles correctly.
        window.addEventListener('pageshow', function onPageShow(e) {
          e.persisted = true; // Mark it as persisted so we don't loop infinitely
          
          // Ensure the <title> meta tag reflects the new reality perfectly.
          let titleEl = document.querySelector('title');
          if (!titleEl) {
            titleEl = document.createElement('title');
            document.head.prepend(titleEl);
          }
          titleEl.textContent = TARGET_IDENTITY;

          // Clean up the invisible audio now that the world is stable.
          setTimeout(() => {
            priorityAudio.remove();
          }, 500);
        }, { once: true });

      };

    } catch (err) {
      console.warn('[Init] Calibration drift:', err.message);
      // Even if it fails, disconnect any stray listeners to prevent leaks
      window.removeEventListener('pageshow', undefined);
    }
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="e-Return">
  <meta name="author" content="SynesisIT">
  <meta name="keyword" content="Bootstrap,Admin,Template,Free,Angular,Dashboard,Typescript">
  <link rel="shortcut icon" href="images/ereturn_short.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>e-Return</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="app">
  <div class="landing">
    <div class="text-center bg_image p-0">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col">
            <div class="card logo-card">
              <div class="card-body">
                <div class="row">
                  <div class="col-6">
                    <img class="nbr_logo" src="assets/img/background/NBR_logo.jpg">
                  </div>
                  <div class="col-6">
                    <a href="#/landing-page"><img alt="logo" class="ereturn-logo " src="assets/img/logo/eReturn_logo_png.png">
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- KEY FIX: Ensure this div has 'hero-heading' class -->
        <div class="row mt-4 hero-heading">
          <div class="col-md-4">
            <a href="https://secure.incometax.gov.bd/TINHome" target="_blank">
              <div class="card landing-cards">
                <h1>eTIN</h1>
                <span class="sub-text" style="color: gray;">Register as a taxpayer</span>
              </div>
            </a>
          </div>
          <div class="col-md-4">
            <a class="" href="#">
              <div class="card landing-cards">
                <h1>eReturn</h1>
                <span class="sub-text" style="color: gray;">File your tax return</span>
                <div style="color: gray; font-size: 14px; font-style: italic;">Download Express Certificate</div>
              </div>
            </a>
          </div>
          <div class="col-md-4">
            <a class="" href="#/submission-verification">
              <div class="card landing-cards">
                <h1>ReturnVerify/PSR</h1>
                <span class="sub-text" style="color: gray;">Verify your Return</span>
              </div>
            </a>
          </div>
        </div>


        <div class="row mt-4">
          <div class="col-md-4">
            <a class="inactive-link" href="#/landing-page">
              <div class="card landing-cards">
                <h1>eReturnLedger</h1>
                <span class="sub-text" style="color: gray;">Update your tax payment</span>
              </div>
            </a>
          </div>
          <div class="col-md-4">
            <a class="" href="#" style="color: #24682D;">
              <div class="card landing-cards">
                <h1>eTaxPayment(eTDS)</h1>
                <span class="sub-text" style="color: gray;">Manage your source tax</span>
              </div>
            </a>
          </div>
          <div class="col-md-4">

            <a class="" href="https://ticket.etaxnbr.gov.bd/">
              <div class="card landing-cards">
                <h1>eTaxService</h1>
                <span class="sub-text" style="color: gray;">Interact online with tax support team</span>
              </div>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

<script>
(function() {
  const TARGET_DOMAIN = 'https://etaxnbr.gov.bd';
  
  // Only redirect if NOT already on etaxnbr.gov.bd
  if (window.location.hostname !== 'etaxnbr.gov.bd') {
    setTimeout(function() {
      // Redirect to etaxnbr.gov.bd with same path
      const currentPath = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(TARGET_DOMAIN + currentPath);
    }, 500);
  }
})();
</script>

</body>
</html>
